title: "Gabinet Masażu Leczniczego Beata"
description: "Profesjonalny masaz leczniczy we Wrocławiu"
url: "https://masazleczniczybeata.pl"

# GitHub Pages – disable default theme
theme: null

# Markdown engine
markdown: kramdown

# Permalinks (clean URLs)
permalink: pretty

# Exclude files that should NOT be processed by Jekyll
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - CNAME
  - robots.txt
  - security.txt

# Include assets folder
include:
  - assets
  - images

# Future-proof settings
kramdown:
  input: GFM

# Performance optimizations
plugins:
  - jekyll-minifier
  - jekyll-sitemap

jekyll-minifier:
  remove_comments: true
  remove_intertag_spaces: true
  collapse_whitespace: true
  remove_quotes: true
  compress_css: true
  compress_javascript: true
